name: epilepsee-ai
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Python
  - python=3.10
  
  # PyTorch (GPU support - will use latest available CUDA)
  - pytorch::pytorch>=2.0.0
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda
  
  # Scientific computing
  - numpy>=1.24.0
  - scipy>=1.10.0
  - pandas>=2.0.0
  
  # Machine learning
  - scikit-learn>=1.2.0
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  
  # Development tools
  - jupyterlab>=3.6.0
  - ipython>=8.10.0
  - pytest>=7.3.0
  - black>=23.0.0
  - flake8>=6.0.0
  
  # Utilities
  - pyyaml>=6.0
  - tqdm>=4.65.0
  - tensorboard>=2.12.0
  - pip
  
  # Install neurophysiology packages via pip
  - pip: 
    - mne>=1.3.0
    - mne-bids>=0.12.0
    - pyedflib>=0.1.30
    - wandb>=0.14.0
    - onnx>=1.22.0
    - onnxruntime-gpu>=1.23.2
